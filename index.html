<style>

</head>
<body>
<div id="start"><div id="panel"><h1>🌿 KÖY HAYATI 3D</h1><p>Güneşli bir Anadolu köyünde yeni hayatın başlıyor.</p><p><button id="play">KÖYE GİR</button></p><small>W A S D: yürü · Fare: etrafa bak · E: araca bin / in · Shift: koş · ESC: fareyi serbest bırak</small></div></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc8e8);scene.fog=new THREE.Fog(0x9bc8e8,65,190);

box(scene,-10,1.25,-5.25,1.1,2.4,.18,M.wood);
box(scene,-13,3.25,-5.2,2.4,1.1,.14,M.dark);box(scene,-13,3.85,-5.1,2.6,.12,.45,M.wood);

box(scene,1.5,1.8,-5.38,6.7,3.5,.16,M.dark);box(scene,1.5,1.8,-5.25,6.2,3.2,.08,mat(0x35332c));
box(scene,4.4,1.1,-5.15,.7,2.2,.2,M.red);box(scene,4.4,2.35,-5.1,.8,.18,.3,M.dark);

for(let x=-30;x<30;x+=2.3){box(scene,x,.55,10,.12,1.1,.12,M.wood);box(scene,x,.2,10,.18,.15,.18,M.wood)}

if(type==='tractor'){box(g,0,.95,0,2.6,.75,3.5,body);box(g,0,1.9,-.45,1.65,1.3,1.8,M.glass);box(g,0,2.62,-.45,1.8,.13,2.0,M.dark);box(g,0,1.2,1.5,1.2,.65,.5,M.dark);for(const s of [-1,1]){for(const zz of [-1.1,1.15]){const r=zz<0?.78:.52;const w=new THREE.Mesh(new THREE.CylinderGeometry(r,r,.38,16),wheel);w.rotation.z=Math.PI/2;w.position.set(s*1.25,r,zz);w.castShadow=true;g.add(w)}}box(g,0,1.5,-1.5,.12,1.4,.12,M.dark);

else if(type==='truck'){box(g,0,.95,-.2,2.8,1.4,4.2,body);box(g,0,1.8,1.25,2.6,1.7,1.5,M.glass);box(g,0,2.8,-.4,2.9,.18,3.7,M.red);for(const s of [-1,1])for(const zz of [-1.5,1.3]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.58,.58,.42,16),wheel);w.rotation.z=Math.PI/2;w.position.set(s*1.35,.58,zz);g.add(w)}}

  // Tempra'nın dış karoserisi: kapı yanları ve ön/arka gövde parçaları tam yükseklikte.
  box(g,-.91,.8,0,.38,.65,4.2,body);box(g,.91,.8,0,.38,.65,4.2,body);
  box(g,0,.8,-1.72,1.45,.65,.96,body);
  box(g,0,.8,1.72,1.45,.65,.96,body);
  box(g,0,1.45,-.35,1.85,1.0,2.15,M.glass);box(g,0,1.1,2.05,1.9,.35,.12,M.dark);
  for(const s of [-1,1])for(const zz of [-1.35,1.35]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.28,16),wheel);w.rotation.z=Math.PI/2;w.position.set(s*1.08,.42,zz);g.add(w)}
}
const cabin=new THREE.Group();g.add(cabin);
// Ön konsol: sürücünün görüşünü kapatmayacak alçak konum.
box(cabin,0,1.12,.72,2.0,.28,.48,mat(0x292b2a));
box(cabin,0,1.29,.68,1.7,.07,.35,mat(0x454846));
for(const sx of [-.62,.62]){
  box(cabin,sx,1.3,.66,.34,.035,.22,mat(0x111817));
  for(let k=0;k<3;k++)box(cabin,sx-.1+k*.1,1.32,.54,.025,.07,.025,mat(0x9aa39b));
}
// Dikey, yuvarlak ve sürücünün tam önünde direksiyon.

for(let k=0;k<3;k++){const ang=k*Math.PI*2/3;const spoke=box(wheelGroup,Math.sin(ang)*.145,Math.cos(ang)*.145,0,.035,.29,.035,mat(0x252927));spoke.rotation.z=-ang}

  const arm=box(cabin,side*.34,1.25,-.12,.13,.12,.42,armMat);arm.rotation.x=-.2;
  const hand=cyl(cabin,side*.25,1.36,.015,.065,.065,.11,handMat,12);hand.rotation.x=Math.PI/2;

  const p=box(cabin,px,.48,.78,.13,.055,.22,mat(0x333735));p.rotation.x=-.3;pedals.push(p);
}

// Koltuk ve sırtlık sürücünün arkasında.
box(cabin,0,.88,-.72,1.05,.2,.82,mat(0x292c2a));
box(cabin,0,1.42,-1.08,1.05,.92,.22,mat(0x303431));
g.userData={type,drive:false,cabin,wheelGroup,pedals};return g}
const vehicles=[vehicle('tractor',9,-.7,0xa43124),vehicle('grader',17,-.8,0xb38b2c),vehicle('truck',27,-.6,0x9c3027),vehicle('car',-21,2,0xc9c8bd)];
// trailer behind truck

// Evin arkasındaki buğday tarlası
const fieldSoil=box(scene,-13,.035,-30,27,.12,17,mat(0x80613d));
const cropMat=mat(0x718d35), wheatMat=mat(0xd2aa3c);
const crops=[];
for(let row=0;row<13;row++){
  for(let col=0;col<23;col++){
    const x=-25.4+col*1.12+(row%2)*.18;
    const z=-37.2+row*1.18;
    const plant=new THREE.Group();
    const stem=new THREE.Mesh(new THREE.CylinderGeometry(.025,.035,1,5),cropMat);
    stem.position.y=.5;plant.add(stem);
    const head=new THREE.Mesh(new THREE.ConeGeometry(.075,.25,5),wheatMat);
    head.position.set(.015,.91,0);plant.add(head);
    plant.position.set(x,.09,z);plant.scale.y=.16;scene.add(plant);
    crops.push({mesh:plant,height:.16,x,z,harvested:false});
  }
}
let growthClock=0,harvestedCount=0;
const trailer=vehicles[2];
function addTrailerWheat(){
  const n=harvestedCount++;
  const x=((n*7)%13-6)*.19;
  const z=-3.7+(((n*11)%15)-7)*.19;
  const layer=Math.floor(n/55);
  const grain=new THREE.Mesh(new THREE.SphereGeometry(.19,7,5),mat(0xd9ad35));
  grain.scale.set(1.25,.48,.82);
  grain.position.set(x,1.98+layer*.13,z);
  grain.rotation.y=(n%7)*.37;
  grain.castShadow=true;trailer.add(grain);
}
// courtyard clutter and barrels
for(let i=0;i<5;i++){cyl(scene,-3+i*.75,.55,-3,.32,.32,1.1,i%2?M.red:M.yellow,12)}
// controls
const keys={};addEventListener('keydown',e=>{if(['KeyW','KeyA','KeyS','KeyD','ShiftLeft','ShiftRight','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='KeyE'&&!e.repeat)interact();if(e.code==='KeyC'&&!e.repeat&&active){externalView=!externalView;hint.textContent=externalView?'Dış kamera · C ile kokpite dön':'Kokpit kamerası · C ile dış kameraya geç'}});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>{for(const k in keys)keys[k]=false});

// Başlangıç noktası: evin ön kapısının hemen karşısı.
camera.position.set(-10,1.7,-2.7);
yaw=0;pitch=0;

function blocked(x,z,r=.4){const inside=(cx,cz,hx,hz)=>Math.abs(x-cx)<hx+r&&Math.abs(z-cz)<hz+r;if(inside(-13,-10,6.5,4.5))return true;if(inside(1.5,-10,4.5,4.5))return true;if(z>9.25&&z<10.9&&x>-31&&x<31)return true;return false;}
function interact(){if(active){const leaving=active;externalView=false;const exitPos=leaving.localToWorld(new THREE.Vector3(-2.25,1.7,.15));camera.position.copy(exitPos);camera.position.y=1.7;yaw=leaving.rotation.y+Math.PI+viewYawOffset;viewYawOffset=0;pitch=0;active=null;mode.textContent='· YAYA';hint.textContent='Araçtan indin · WASD ile yürüyebilirsin';return}let best=null,dist=5;for(const v of vehicles){const d=camera.position.distanceTo(new THREE.Vector3(v.position.x,1,v.position.z));if(d<dist){best=v;dist=d}}if(best){active=best;yaw=best.rotation.y+Math.PI;viewYawOffset=0;pitch=0;mode.textContent='· '+({tractor:'TRAKTÖR',grader:'GREYDER',truck:'KAMYON',car:'TEMPRA'}[best.userData.type]);hint.textContent='W: gaz · S: fren/geri · A/D: direksiyon · E: in'}else hint.textContent='Araca binmek için yanına yaklaş'}

  const cabY=(active.userData.type==='grader'||active.userData.type==='truck')?1.58:1.34;
  const cabZ=(active.userData.type==='grader'||active.userData.type==='truck')?-1.38:-1.12;

}}
else{const next=camera.position.clone().addScaledVector(move,speed);if(!blocked(next.x,next.z,.38)){camera.position.x=next.x;camera.position.z=next.z}camera.position.y=1.7;camera.position.x=Math.max(-42,Math.min(42,camera.position.x));camera.position.z=Math.max(-42,Math.min(30,camera.position.z));if(move.lengthSq()===0)hint.textContent='WASD ile yürü · E ile araçlara bin'}}
renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
